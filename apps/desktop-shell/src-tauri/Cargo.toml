[package]
name = "xiaoliuren"
version = "1.261025.5"
edition = "2021"
description = "小六壬 · 起卦解卦台"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-http = "2"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# ★ （app 内更新·桌面档 B）：下载更新包要解压 + 校验
#   sha2 = 比对清单里的 sha256（断网半截/被代理塞坏包时拒绝换装）
#   zip  = 解 .zip（只开 deflate：分发包的压缩方式就这一种，别的格式不用支持）
sha2 = "0.10"
zip = { version = "2", default-features = false, features = ["deflate"] }

# ★ （可选构建）：`--features portable` 才编出「配置随包走 + 单实例」那份。
#   默认（正式版 / lite）不带这个 feature ⇒ 行为与以前一致；判据在 main.rs 里用 `cfg!(feature="portable")`。
[features]
portable = []

# 体积优先：Tauri 本身就小，这几项再压一压
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
