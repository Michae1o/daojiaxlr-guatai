<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390, initial-scale=1, viewport-fit=cover">
<title>道家小六壬 · 卦台</title>
<meta name="description" content="小六壬 · 卦台：输入问题与背景，报数或月日时起卦，本地规则引擎出判据，可接模型出断辞。">
<script>
(function () {
  try {
    var s = localStorage.getItem('xlr-theme');
    var m = window.matchMedia('(prefers-color-scheme: dark)').matches;
    document.documentElement.setAttribute('data-theme', s || (m ? 'dark' : 'light'));
  } catch (e) { }
})();
</script>
